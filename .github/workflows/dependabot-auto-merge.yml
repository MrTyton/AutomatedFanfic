name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Serialize all Dependabot PR processing and release-bumping workflows under a
# single shared concurrency group ('release-pipeline') so concurrent PRs,
# scheduled sweeps, and update-dependencies runs never race to bump or release
# the same version.
concurrency:
  group: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]') && 'release-pipeline' || format('non-dependabot-pr-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

jobs:
  process-pr-event:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/process-dependabot-pr.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  discover-open-prs:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_prs: ${{ steps.find-prs.outputs.has_prs }}
      pr_numbers_json: ${{ steps.find-prs.outputs.pr_numbers_json }}

    steps:
      - name: Setup GitHub CLI
        run: gh --version

      - name: Find open Dependabot PRs
        id: find-prs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUMBERS_JSON=$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --search "is:pr is:open author:app/dependabot" \
            --json number \
            --jq '[.[].number] | sort')

          if [ "$PR_NUMBERS_JSON" = "[]" ]; then
            echo "has_prs=false" >> $GITHUB_OUTPUT
            echo "No open Dependabot PRs found"
            exit 0
          fi

          echo "has_prs=true" >> $GITHUB_OUTPUT
          echo "pr_numbers_json=$PR_NUMBERS_JSON" >> $GITHUB_OUTPUT

  process-open-prs:
    needs: discover-open-prs
    if: needs.discover-open-prs.outputs.has_prs == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr_number: ${{ fromJson(needs.discover-open-prs.outputs.pr_numbers_json) }}
    uses: ./.github/workflows/process-dependabot-pr.yml
    with:
      pr_number: ${{ matrix.pr_number }}
    secrets: inherit
