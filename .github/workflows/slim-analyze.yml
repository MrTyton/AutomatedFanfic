name: Slim Image Analysis

# Runs static xray analysis after a successful Docker publish,
# or manually against any published tag.
on:
    workflow_run:
        workflows: ["Publish Docker Image"]
        types:
            - completed
    workflow_dispatch:
        inputs:
            image_tag:
                description: "Image tag to analyze (e.g. 'latest', '2.3.0')"
                required: false
                default: "latest"

env:
    IMAGE_REPO: mrtyton
    IMAGE_NAME: automated-ffdl

jobs:
    slim_xray:
        name: xray (static layer analysis)
        runs-on: ubuntu-latest
        # Only run when the publish workflow succeeded, or on manual dispatch
        if: >
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success'

        steps:
            - name: Resolve image tag
              id: tag
              run: |
                  TAG="${{ github.event.inputs.image_tag || 'latest' }}"
                  IMAGE="${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:${TAG}"
                  echo "tag=$TAG" >> $GITHUB_OUTPUT
                  echo "image=$IMAGE" >> $GITHUB_OUTPUT
                  echo "Analyzing image: $IMAGE"

            - name: Pull target image (amd64)
              run: |
                  docker pull --platform linux/amd64 ${{ steps.tag.outputs.image }}

            # Run slim xray via the official container image.
            # --changes all  → show every add/modify/delete across all layers
            # --add-image-manifest / --add-image-config → embed raw manifest in report
            - name: Run slim xray
              run: |
                  docker run --rm \
                    -v /var/run/docker.sock:/var/run/docker.sock \
                    dslim/slim xray \
                      --changes all \
                      --add-image-manifest \
                      --add-image-config \
                      --show-special-perms \
                      --detect-duplicates \
                      ${{ steps.tag.outputs.image }}

            # Save the xray report as a workflow artifact for later review
            - name: Upload slim report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: slim-report-${{ steps.tag.outputs.tag }}
                  path: slim.report.json
                  if-no-files-found: ignore
                  retention-days: 30

    # Optional dynamic analysis job.
    # Only runs when SLIM_CONFIG_TOML secret is set (base64-encoded config.toml).
    # Starts the actual app inside the Slim sensor container for ~45 seconds so
    # Slim can observe every file/library the running application touches.
    slim_build:
        name: build (dynamic analysis)
        runs-on: ubuntu-latest
        needs: slim_xray
        # Gate on: manual trigger AND the secret being available
        if: >
            github.event_name == 'workflow_dispatch' &&
            secrets.SLIM_CONFIG_TOML != ''
        env:
            SLIM_CONFIG_TOML: ${{ secrets.SLIM_CONFIG_TOML }}

        steps:
            - name: Resolve image tag
              id: tag
              run: |
                  TAG="${{ github.event.inputs.image_tag || 'latest' }}"
                  IMAGE="${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:${TAG}"
                  echo "tag=$TAG" >> $GITHUB_OUTPUT
                  echo "image=$IMAGE" >> $GITHUB_OUTPUT

            - name: Pull target image (amd64)
              run: docker pull --platform linux/amd64 ${{ steps.tag.outputs.image }}

            - name: Write production config to disk
              run: |
                  mkdir -p /tmp/slim-config
                  echo "$SLIM_CONFIG_TOML" | base64 -d > /tmp/slim-config/config.toml
                  echo "Config written to /tmp/slim-config/config.toml"

            # slim build with:
            #   --http-probe=false        → this is not an HTTP service
            #   --mount                   → inject the production config
            #   --continue-after=45       → let the app run for 45 s so Slim captures all file accesses
            #   --show-clogs              → stream the app's container logs for visibility
            #   --sensor-ipc-mode=proxy   → required in containerized CI environments
            - name: Run slim build (dynamic analysis)
              run: |
                  docker run --rm \
                    -v /var/run/docker.sock:/var/run/docker.sock \
                    dslim/slim build \
                      --http-probe=false \
                      --mount /tmp/slim-config:/config \
                      --continue-after=45 \
                      --show-clogs \
                      --sensor-ipc-mode=proxy \
                      --tag ${{ steps.tag.outputs.image }}.slim \
                      ${{ steps.tag.outputs.image }}

            - name: Report slimmed image size
              if: success()
              run: |
                  echo "=== Original image ==="
                  docker images ${{ steps.tag.outputs.image }} --format "{{.Repository}}:{{.Tag}} => {{.Size}}"
                  echo "=== Slimmed image ==="
                  docker images ${{ steps.tag.outputs.image }}.slim --format "{{.Repository}}:{{.Tag}} => {{.Size}}"

            - name: Upload slim report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: slim-build-report-${{ steps.tag.outputs.tag }}
                  path: slim.report.json
                  if-no-files-found: ignore
                  retention-days: 30
