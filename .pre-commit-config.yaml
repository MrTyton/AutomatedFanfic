# Pre-commit configuration file
# Automatically enforces code quality standards before commits

repos:
  # Black: The uncompromising Python code formatter
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3

  # Ruff: An extremely fast Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Built-in hooks for basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: debug-statements

  # Pyright & Web UI checks matching CI
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: npx --yes pyright
        language: system
        pass_filenames: false
        always_run: true

      - id: web-ui-lint
        name: web-ui-lint (React Hooks & ESLint)
        entry: npm --prefix root/web-ui run lint
        language: system
        pass_filenames: false
        files: ^root/web-ui/src/
