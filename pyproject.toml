[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automatedfanfic"
version = "6.15.11"
description = "Automated Fanfic Downloader"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["root/app"]

[tool.pytest.ini_options]
testpaths = ["root/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "flaky_ci: Tests that are flaky or environment-dependent in headless CI"
]

[tool.ruff]
target-version = "py315"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
]
ignore = [
    "E501",  # Line too long (handled by black when possible)
]

[tool.black]
line-length = 88
